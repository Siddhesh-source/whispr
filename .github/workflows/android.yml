name: android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17 runs Gradle; 21 runs JVM unit tests (libsignal targets Java 21).
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - name: Lint (ktlint + Android Lint)
        run: ./gradlew ktlintCheck lintDebug
      - name: Design-token check
        run: ./gradlew :app:checkDesignTokens
      - name: Unit, accessibility and contrast tests
        run: ./gradlew testDebugUnitTest :domain:test
      - name: Assemble
        run: ./gradlew assembleDebug
      # Screenshots render differently across OSes (fonts, AA), so CI records
      # them for review instead of diffing against Windows-recorded goldens.
      - name: Record screenshots
        run: ./gradlew :core:designsystem:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        with:
          name: design-system-screenshots
          path: android/core/designsystem/screenshots/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: android/**/build/reports/

  instrumented:
    # On-device tests: AndroidKeyStore wrapping, identity persistence, and
    # SQLCipher encryption (none of which exist on the JVM).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            17
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew :data:connectedDebugAndroidTest
