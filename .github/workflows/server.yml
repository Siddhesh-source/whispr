name: server

on:
  push:
    branches: [main]
    paths: ["server/**", "docker-compose.yml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "docker-compose.yml", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: whispr
          POSTGRES_PASSWORD: whispr
          POSTGRES_DB: whispr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U whispr -d whispr_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: server
      - name: Unit + Postgres integration tests
        env:
          WHISPR_TEST_DATABASE_URL: postgres://whispr:whispr@localhost:5432/whispr_test?sslmode=disable
        run: go test -race -count=1 ./...

  libsignal:
    # Builds libsignal-ffi and runs the full suite with real signatures
    # (-tags libsignal), then builds the production image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Tests with real libsignal
        uses: docker/build-push-action@v6
        with:
          context: server
          target: test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Production image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha
