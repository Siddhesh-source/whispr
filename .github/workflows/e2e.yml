name: e2e

# Real Android data layer against the real server (docker compose): the live
# tests, plus a check that a marker message never appears in plaintext in the
# server's database or in the traffic between devices and server.
on:
  push:
    branches: [main]
    paths: ["android/**", "server/**", "docker-compose.yml", ".github/workflows/e2e.yml", ".github/scripts/**"]
  pull_request:
    paths: ["android/**", "server/**", "docker-compose.yml", ".github/workflows/e2e.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run (main keeps every run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions are pinned to commit SHAs (tags are mutable); Dependabot keeps them current.
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same cache scope as server.yml, so the slow libsignal build is reused.
      # Tagged with compose's default name so `compose up --no-build` uses it.
      - name: Server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          tags: whispr-server:latest
          cache-from: type=gha,scope=server
      - name: Start the stack
        # Every live-test client signs in and registers from 127.0.0.1, so
        # the per-IP limits (30 sign-ins a minute, 10 registrations an hour)
        # would throttle the suite itself; the suite registers 11 accounts.
        env:
          RATE_LIMIT_PER_MINUTE: "600"
          REGISTRATIONS_PER_HOUR: "600"
          USER_REQUESTS_PER_MINUTE: "6000"
        run: docker compose up -d --no-build --wait server
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Marker
        run: echo "WHISPR_E2E_MARKER=whispr-e2e-marker-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
      - name: Capture traffic
        run: |
          sudo tcpdump -i lo -U -w "$RUNNER_TEMP/frames.pcap" 'tcp port 8080' &
          sleep 2
      - name: Live tests
        working-directory: android
        env:
          WHISPR_SERVER_URL: http://127.0.0.1:8080/
        run: >-
          ./gradlew -Porg.gradle.java.installations.auto-download=false
          :data:testDebugUnitTest --tests '*Live*'
      - name: Stop capture
        if: always()
        run: sudo pkill -INT tcpdump; sleep 1; sudo chmod a+r "$RUNNER_TEMP/frames.pcap"
      - name: Dump the server database
        run: docker compose exec -T db pg_dump -U whispr whispr > "$RUNNER_TEMP/db.sql"
      # Every object in the media bucket, byte for byte. LiveGroupsTest uploads
      # a picture whose plaintext contains the marker.
      - name: Copy the object storage bucket
        run: |
          mkdir -p "$RUNNER_TEMP/bucket"
          # The client image runs as uid 65532; without write access it
          # "mirrors" nothing and still exits 0.
          chmod 777 "$RUNNER_TEMP/bucket"
          mc() {
            docker run --rm --network whispr_default \
              -e MC_HOST_local=http://whispr:whispr-dev-only@minio:9000 \
              -v "$RUNNER_TEMP/bucket:/out" \
              cgr.dev/chainguard/minio-client:latest "$@"
          }
          set +e
          listing=$(mc ls --recursive local/whispr-media 2>&1); ls_rc=$?
          mirror=$(mc mirror local/whispr-media /out 2>&1); mirror_rc=$?
          set -e
          sudo chmod -R a+r "$RUNNER_TEMP/bucket"
          count=$(find "$RUNNER_TEMP/bucket" -type f | wc -l)
          echo "objects: $count, ls rc=$ls_rc, mirror rc=$mirror_rc"
          echo "$listing"
          echo "$mirror"
          # An empty bucket would prove nothing. Job logs need sign-in to read,
          # so the evidence also goes into annotations.
          if [ "$mirror_rc" -ne 0 ] || [ "$count" -eq 0 ]; then
            echo "::error title=bucket copy::objects=$count ls_rc=$ls_rc mirror_rc=$mirror_rc networks=$(docker network ls --format '{{.Name}}' | paste -sd ' ')"
            echo "::error title=bucket ls::$(echo "$listing" | tail -5 | paste -sd '|')"
            echo "::error title=bucket mirror::$(echo "$mirror" | tail -5 | paste -sd '|')"
            echo "::error title=server media log::$(docker compose logs server 2>&1 | grep -i -m5 -e attach -e s3 -e media | paste -sd '|')"
            exit 1
          fi
      # Client-to-server WebSocket frames are masked, so the capture mainly
      # proves the server-to-client direction and plain HTTP; the database
      # dump and bucket copy cover what the server stores.
      - name: No plaintext marker anywhere
        run: >-
          find "$RUNNER_TEMP/bucket" -type f -print0 |
          xargs -0 python3 .github/scripts/no-marker.py "$WHISPR_E2E_MARKER"
          "$RUNNER_TEMP/frames.pcap" "$RUNNER_TEMP/db.sql"
      - name: Server logs
        if: failure()
        run: docker compose logs server
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-reports
          path: |
            android/data/build/reports/
            android/data/build/test-results/
          retention-days: 14
